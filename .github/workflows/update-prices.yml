name: Update prices

on:
  schedule:
    # Noon Prague, weekdays. Cron is UTC and has no notion of DST, so this
    # is 12:07 during CEST (UTC+2) and 11:07 during CET (UTC+1) — switch to
    # '7 11 * * 1-5' at the October changeover to hold noon through winter.
    #
    # The :07 is deliberate. GitHub dispatches scheduled runs from a shared
    # best-effort queue, and :00 is where most of the world schedules, so
    # runs asking for the top of the hour queue behind that spike — this
    # one was arriving ~50 min late, once 10 h late, and once not at all.
    - cron: '7 10 * * 1-5'
  workflow_dispatch: # allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pytz

      - name: Fetch prices and update history.js
        run: python scripts/update_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.js
          git diff --staged --quiet || git commit -m "chore: update prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
